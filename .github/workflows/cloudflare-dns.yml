name: ->Cloudflare DNS (manual record)

# Ad-hoc DNS record management for any brand zone (beaconpulse.net, sysops247.com, ...).
# The zone is derived from RECORD_NAME's registrable apex.
#
# Environment hosts are handled automatically by the `dns` job in deploy-k3s.yml,
# which reads the hostname straight out of the env's Helm values file. Use this
# workflow for one-offs: a preview host, a redirect, an ACME DNS-01 TXT, etc.
#
# The underlying script (deploy/scripts/cloudflare-dns.sh) is an idempotent upsert,
# so re-running with the same values is a no-op rather than a duplicate record.

on:
  workflow_dispatch:
    inputs:
      RECORD_NAME:
        description: "Full record name, e.g. preview.beaconpulse.net (apex: beaconpulse.net)"
        required: true
        type: string
      RECORD_CONTENT:
        description: "Record value, e.g. lon1.pop0.uk"
        required: true
        default: "lon1.pop0.uk"
        type: string
      ZONE:
        description: "Zone apex override for names the derivation below gets wrong (direct .uk registrations like cognoai.uk, unknown two-label suffixes like workstation.co.th)"
        required: false
        type: string
      RECORD_TYPE:
        description: "Record type"
        required: true
        default: "CNAME"
        type: choice
        options:
          - CNAME
          - A
          - AAAA
          - TXT
      PROXIED:
        description: "Proxy through Cloudflare (orange cloud). Leave false so cert-manager can solve HTTP-01."
        required: false
        default: false
        type: boolean
      DRY_RUN:
        description: "Show what would change without writing"
        required: false
        default: false
        type: boolean

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upsert DNS record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only beaconpulse.net's zone id is held in CI. For any other brand domain
          # (sysops247.com, ...) the DNS script resolves the zone id from the zone NAME,
          # so the token needs Zone:Read on that zone — same contract as deploy-k3s.yml.
          BEACONPULSE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          # The zone is the registrable apex (last two labels) of the record name, so a
          # record on any brand domain works without hardcoding a zone.
          # Registrable apex: last two labels, or last THREE when the TLD is a
          # two-label public suffix (co.uk, org.uk, ...) — "last two" alone
          # derived the zone of grafana.workstation.co.uk as "co.uk".
          ZONE="${{ inputs.ZONE }}"
          if [ -z "$ZONE" ]; then
            ZONE="$(echo "${{ inputs.RECORD_NAME }}" | awk -F. '{
              if ($NF=="uk" || $NF=="au" || $NF=="nz" || $NF=="jp" || $NF=="br")
                print $(NF-2)"."$(NF-1)"."$NF;
              else
                print $(NF-1)"."$NF }')"
          fi
          export CLOUDFLARE_ZONE="$ZONE"
          if [ "$ZONE" = "beaconpulse.net" ]; then export CLOUDFLARE_ZONE_ID="$BEACONPULSE_ZONE_ID"; fi
          echo "Upserting ${{ inputs.RECORD_NAME }} (zone ${ZONE})"
          ARGS=(
            --name "${{ inputs.RECORD_NAME }}"
            --content "${{ inputs.RECORD_CONTENT }}"
            --type "${{ inputs.RECORD_TYPE }}"
            --proxied "${{ inputs.PROXIED }}"
          )
          if [ "${{ inputs.DRY_RUN }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          ./deploy/scripts/cloudflare-dns.sh "${ARGS[@]}"
