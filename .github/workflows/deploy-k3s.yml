name: ->Beacon Build/Push Docker Images and Deploy to K3S

# Build the three Beacon images (api, worker, frontend) to SpectonCR and deploy
# the Helm chart to the chosen environment's namespace on k3s. Manual trigger so
# environment promotion is deliberate — same pattern as the opsapi platform.
on:
  # Continuous deployment: every push to main builds the images and deploys to
  # the int environment (TARGET_ENV/DEPLOYMENT_TYPE resolve to int/build-and-deploy
  # via the env: block below, since push events carry no workflow inputs).
  push:
    branches:
      - main

  # Manual promotion to any environment (test/acc/prod) or build/deploy-only.
  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Target environment"
        default: "int"
        required: true
        options:
          - int
          - test
          - acc
          - prod
      DEPLOYMENT_TYPE:
        type: choice
        description: "Build only, deploy only, or both"
        default: "build-and-deploy"
        required: true
        options:
          - build
          - deploy
          - build-and-deploy
      IMAGE_TAG:
        type: string
        description: "Image tag to DEPLOY (deploy-only). Leave blank to use this commit's short SHA."
        default: ""
        required: false
      BRAND:
        type: choice
        description: "White-label brand. 'beacon' = default product; 'sysops' = SysOps 24/7 on its own domain + namespace, fully automated (DNS, wslproxy, deploy)."
        default: "beacon"
        required: true
        options:
          - beacon
          - sysops

env:
  # SpectonCR (private OCI registry, https via the wslproxy ingress). The host is
  # resolved per environment in the `Resolve registry` step below rather than being
  # hardcoded here — prod sits on the bare host, every other env gets the env
  # prefix. Same convention as the platform's other charts.
  IMAGE_NAMESPACE: beacon
  # The architecture the CLUSTER runs. Every k3s1 node is amd64, and the `build`
  # job runs on ubuntu-latest (also amd64), so this is a NATIVE build — stated
  # explicitly, and asserted before every push, because getting it wrong is
  # silent: the registry accepts the image, helm rolls it out, and only then does
  # the kubelet die with "exec format error", which helm reports ten minutes later
  # as nothing more useful than "Progress deadline exceeded".
  BUILD_PLATFORM: linux/amd64
  # DOCKER_BUILDKIT=0 (the old legacy-builder workaround) is gone. It existed
  # because BuildKit pushed an OCI image *index*, whose manifest HEAD SpectonCR
  # mishandles:
  #   'unexpected status from HEAD request to .../manifests/<digest>'
  # --provenance=false --sbom=false suppresses the attestation manifests that
  # create that index, so buildx emits a single manifest and `docker push` sends
  # exactly what the registry already accepted. Verified against the real registry:
  # zero attestation/manifest-list lines, and the push succeeds.
  BUILDX_FLAGS: --provenance=false --sbom=false
  TARGET_ENV: ${{ github.event.inputs.TARGET_ENV || 'int' }}
  DEPLOYMENT_TYPE: ${{ github.event.inputs.DEPLOYMENT_TYPE || 'build-and-deploy' }}
  # White-label brand baked into the frontend image (NEXT_PUBLIC_BRAND). Default keeps
  # every push to main building Beacon exactly as before; only a manual dispatch with a
  # different BRAND produces a branded image (tagged <brand>-<sha>).
  BRAND: ${{ github.event.inputs.BRAND || 'beacon' }}
  # DNS: every environment host is a CNAME to the wslproxy edge, same as the rest
  # of the platform. The hostname itself is read from the env's Helm values file so
  # DNS can never drift from what the Ingress actually serves.
  DNS_ZONE: beaconpulse.net
  # Traffic path: Cloudflare CNAMEs the host to pop0 (the WSL Proxy edge, and the
  # same IP as the prod-our control plane we register the vhost on). pop0 then
  # applies the beaconpulse-prod-default rule, which proxies to the k3s1 Traefik
  # ingress at 13.42.188.136:80, which routes to the beacon pods on debworker00.
  #   browser -> pop0.wslproxy.com -> 13.42.188.136:80 (traefik) -> beacon-nginx
  DNS_TARGET: pop0.wslproxy.com
  DNS_PROXIED: "false" # DNS-only: cert-manager solves HTTP-01 and wslproxy terminates TLS

jobs:
  # Runs before `deploy` so the record exists (and has had a moment to propagate)
  # before cert-manager attempts its HTTP-01 challenge against the new host.
  # Cloudflare only needs egress, not the cluster, so this runs on a hosted runner.
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure the CNAME for this environment
        if: ${{ env.DEPLOYMENT_TYPE == 'deploy' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only beaconpulse.net's zone id is held in CI. For any OTHER brand domain the
          # DNS script resolves the zone id from the zone NAME (the token needs Zone:Read
          # on that zone), so no new per-domain secret is required.
          BEACONPULSE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          # The brand selects its own values overlay — host + namespace differ per brand.
          if [ "$BRAND" = "beacon" ]; then
            VALUES="deploy/helm/beacon/values-${TARGET_ENV}.yaml"
          else
            VALUES="deploy/helm/beacon/values-${BRAND}-${TARGET_ENV}.yaml"
          fi
          [ -f "$VALUES" ] || { echo "::error::no values file '$VALUES' (brand='${BRAND}', env='${TARGET_ENV}')"; exit 1; }

          # Single source of truth: whatever hosts the chart's Ingress claims —
          # the primary `host:` plus any `extraHosts:` entries (e.g. www beside an apex).
          HOST="$(awk '/^host:/{print $2; exit}' "$VALUES")"
          [ -n "$HOST" ] || { echo "::error::no 'host:' in $VALUES"; exit 1; }
          EXTRA_HOSTS="$(awk '/^extraHosts:/{f=1;next} f && /^[ ]*- /{print $2;next} f{exit}' "$VALUES")"

          for H in $HOST $EXTRA_HOSTS; do
            # The Cloudflare zone is the registrable apex (last two labels) of the host, so
            # a brand on any domain works without hardcoding a zone. Beacon keeps its exact
            # path — the known zone id is passed so no Zone:Read scope is needed for it.
            ZONE="$(echo "$H" | awk -F. '{print $(NF-1)"."$NF}')"
            export CLOUDFLARE_ZONE="$ZONE"
            if [ "$ZONE" = "beaconpulse.net" ]; then
              export CLOUDFLARE_ZONE_ID="$BEACONPULSE_ZONE_ID"
            else
              unset CLOUDFLARE_ZONE_ID
            fi

            echo "Ensuring ${H} (zone ${ZONE}) -> ${DNS_TARGET} (proxied=${DNS_PROXIED})"
            ./deploy/scripts/cloudflare-dns.sh \
              --name "$H" \
              --content "$DNS_TARGET" \
              --proxied "$DNS_PROXIED"
          done

  # DNS now resolves to the edge, so register the vhost + rule on the WSL Proxy
  # control plane BEFORE helm rolls the app — otherwise the hostname resolves to an
  # edge with no config for it. Reuses the manual workflow rather than duplicating
  # the import logic. ACTIVATE_CONFIG=true writes the vhost and takes it live.
  #
  # TARGET_ENV is the WSL Proxy PROFILE, not the Beacon env: every beaconpulse host
  # (int/test/acc + apex) lives under the 'prod' profile dir. The import is
  # idempotent — records are keyed by their committed slug ids.
  wslproxy:
    name: Register WSL Proxy vhost
    needs: [dns]
    if: ${{ (github.event.inputs.DEPLOYMENT_TYPE || 'build-and-deploy') != 'build' }}
    uses: ./.github/workflows/wslproxy-register-domains.yml
    with:
      TARGET_ENV: prod
      ACTIVATE_CONFIG: true
      DRY_RUN: false
    secrets: inherit

  build:
    # RUNNER SELECTION IS ARCH- AND NETWORK-DRIVEN:
    #   • non-prod builds run on ubuntu-latest — amd64 (native, matches the k3s
    #     nodes) and the int/acc/test registries answer publicly over HTTPS.
    #   • prod builds run on the self-hosted Linux runner (labels self-hosted,Linux,X64):
    #     the prod registry's public path (pop1) 499s large blob PUTs, so prod images
    #     are pushed through an SSH tunnel to cloud001's localhost NodePort (:30502),
    #     the node the registry pods actually run on. That runner is amd64 Linux, so
    #     the build is still native. Mirrors diy-tax-return-uk auto-tag-main.yml.
    # The `deploy` job stays self-hosted regardless: the k3s API and wslproxy control
    # plane don't answer from outside the LAN.
    runs-on: ${{ (github.event.inputs.TARGET_ENV || 'int') == 'prod' && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    outputs:
      registry: ${{ steps.reg.outputs.registry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag (short SHA)
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Not gated on DEPLOYMENT_TYPE: `deploy`-only runs still need this output.
      - name: Resolve registry for this environment
        id: reg
        run: |
          set -euo pipefail
          # REGISTRY = where the CLUSTER pulls from (the values-file host, HTTPS).
          # PUSH_HOST = where CI pushes to. Same as REGISTRY everywhere except prod,
          # which pushes to the NodePort (the public HTTPS path 499s large blob PUTs).
          # Both map to the SAME registry backend, so the cluster still pulls fine
          # from the hostname. Port map (spectoncr NodePorts): prod=30502.
          #
          # The push goes through an SSH TUNNEL to cloud001 (72.62.211.28), the node
          # the prod registry pods run on. Nothing else reaches them reliably:
          #   • LAN NodePorts (192.168.1.x:30502) DNAT across the broken LAN<->cloud
          #     pod network and black-hole 100% of the time.
          #   • cloud001's NodePort hit directly over the internet drops ~50-60% of
          #     connections (measured from both the LAN and AWS) — unusable for a
          #     multi-blob docker push.
          #   • From cloud001 itself, localhost:30502 is 100% reliable (measured 8/8
          #     through the tunnel). The tunnel also encrypts the plain-HTTP push +
          #     basic-auth that would otherwise cross the internet in clear.
          # The tunnel is opened by the step below; buildkit runs with host networking
          # so 127.0.0.1 inside the builder is the runner's loopback.
          case "$TARGET_ENV" in
            prod) REGISTRY="spectoncr.diytaxreturn.co.uk"; PUSH_HOST="127.0.0.1:30599" ;;
            *)    REGISTRY="${TARGET_ENV}-spectoncr.diytaxreturn.co.uk"; PUSH_HOST="$REGISTRY" ;;
          esac

          # Drift guard: the chart must PULL from the host CI publishes to (same backend).
          # Validated against REGISTRY (the pull host); the prod push goes to the LAN
          # NodePort but lands in the identical registry the hostname serves.
          VALUES="deploy/helm/beacon/values-${TARGET_ENV}.yaml"
          CHART_REG="$(awk '/^image:/{f=1;next} f && /^  registry:/{print $2; exit}' "$VALUES")"
          if [ "$CHART_REG" != "$REGISTRY" ]; then
            echo "::error::registry drift — workflow resolves '$REGISTRY' but ${VALUES} declares '${CHART_REG}'"
            exit 1
          fi

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "push_host=$PUSH_HOST" >> "$GITHUB_OUTPUT"
          echo "Registry for '${TARGET_ENV}': pull=${REGISTRY} push=${PUSH_HOST}"

      # The prod push path: an SSH local-forward to cloud001, so the registry is
      # reached as 127.0.0.1:30599 on the runner. The local port is deliberately
      # NOT 30502: the runner host is itself a k3s node, and kube-proxy's NodePort
      # iptables rules intercept ALL local traffic to 30502 — loopback included —
      # DNATing it into the broken cross-network path before the ssh listener ever
      # sees it (verified: tunnel up, curl 127.0.0.1:30502 → 000; same via 30599 →
      # 401). The runner user's key already authorizes bwalia@cloud001.
      - name: Open SSH tunnel to the prod registry (cloud001)
        if: ${{ (github.event.inputs.TARGET_ENV || 'int') == 'prod' && (env.DEPLOYMENT_TYPE == 'build' || env.DEPLOYMENT_TYPE == 'build-and-deploy') }}
        run: |
          set -euo pipefail
          # A stale tunnel from a previous job would hold the port — clear it first.
          pkill -f "30599:127.0.0.1:30502" || true
          ssh -f -N \
            -o BatchMode=yes \
            -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -L 30599:127.0.0.1:30502 \
            bwalia@72.62.211.28
          echo "Tunnel up: 127.0.0.1:30599 -> cloud001 localhost:30502"

      # prod pushes to the tunneled NodePort over plain HTTP (the tunnel itself is
      # encrypted). buildkit refuses http registries unless told they're insecure —
      # do that per-job via a container builder rather than editing the shared
      # runner's docker daemon. network=host lets the builder container reach the
      # tunnel's loopback listener.
      - name: Set up Buildx for the prod NodePort registry
        if: ${{ (github.event.inputs.TARGET_ENV || 'int') == 'prod' && (env.DEPLOYMENT_TYPE == 'build' || env.DEPLOYMENT_TYPE == 'build-and-deploy') }}
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."127.0.0.1:30599"]
              http = true
              insecure = true

      - name: Registry auth (SpectonCR)
        if: ${{ env.DEPLOYMENT_TYPE == 'build' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        env:
          NEBULACR_USERNAME: ${{ secrets.NEBULACR_USERNAME }}
          NEBULACR_PASSWORD: ${{ secrets.NEBULACR_PASSWORD }}
          # prod keeps its own secret so a future rotation of one registry can't break
          # the other; the value is the same admin credential today.
          NEBULACR_PROD_USERNAME: ${{ secrets.NEBULACR_PROD_USERNAME }}
          NEBULACR_PROD_PASSWORD: ${{ secrets.NEBULACR_PROD_PASSWORD }}
        run: |
          set -euo pipefail
          REG="${{ steps.reg.outputs.registry }}"
          PUSH_HOST="${{ steps.reg.outputs.push_host }}"
          if [ "$TARGET_ENV" = "prod" ] && [ -n "${NEBULACR_PROD_USERNAME:-}" ]; then
            RUSER="$NEBULACR_PROD_USERNAME"; RPASS="$NEBULACR_PROD_PASSWORD"
          else
            RUSER="$NEBULACR_USERNAME"; RPASS="$NEBULACR_PASSWORD"
          fi
          if [ "$TARGET_ENV" = "prod" ]; then
            # Write the credential straight into docker config for the NodePort push host.
            # buildkit uses it for the push token dance; transport is plain HTTP (the
            # config-inline above). We deliberately do NOT touch the shared runner's
            # docker daemon.
            mkdir -p "$HOME/.docker"
            AUTH="$(printf '%s:%s' "$RUSER" "$RPASS" | base64 | tr -d '\n')"
            printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUSH_HOST" "$AUTH" >"$HOME/.docker/config.json"
            # Fail fast (with an actionable message) if the tunneled registry isn't reachable.
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 -u "$RUSER:$RPASS" "http://$PUSH_HOST/v2/" || echo 000)"
            case "$code" in
              200|401) echo "prod registry $PUSH_HOST reachable (HTTP $code); cluster pulls from $REG" ;;
              *) echo "::error::prod registry $PUSH_HOST unreachable (HTTP $code) — is the SSH tunnel to cloud001 up and is the spectoncr-registry-nodeport (30502) service healthy?"; exit 1 ;;
            esac
          else
            printf '%s' "$RPASS" | docker login "$REG" -u "$RUSER" --password-stdin
          fi

      - name: Build & push backend (api + worker share one image)
        if: ${{ env.DEPLOYMENT_TYPE == 'build' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        run: |
          set -euo pipefail
          SHA=${{ steps.tag.outputs.sha }}
          NS="${{ steps.reg.outputs.push_host }}/$IMAGE_NAMESPACE"
          # One backend image contains both binaries; api/worker differ by command.
          # --platform is explicit so a wrong-arch image can never ship silently.
          # --provenance/--sbom are off (BUILDX_FLAGS) so buildx emits a single manifest
          # the registry accepts.
          if [ "$TARGET_ENV" = "prod" ]; then
            # prod: buildkit pushes to cloud001's NodePort through the SSH tunnel
            # (native amd64 on the self-hosted Linux runner — no emulation).
            docker buildx build --platform "$BUILD_PLATFORM" $BUILDX_FLAGS --push \
              -f deploy/docker/Dockerfile.backend \
              --build-arg BEACON_VERSION="$SHA" \
              -t "$NS/api:$SHA" -t "$NS/api:latest" \
              -t "$NS/worker:$SHA" -t "$NS/worker:latest" .
          else
            # non-prod: --load a plain image, assert arch, then docker push to the public host.
            docker buildx build --platform "$BUILD_PLATFORM" $BUILDX_FLAGS --load \
              -f deploy/docker/Dockerfile.backend \
              --build-arg BEACON_VERSION="$SHA" \
              -t "$NS/api:$SHA" -t "$NS/api:latest" \
              -t "$NS/worker:$SHA" -t "$NS/worker:latest" .
            ./deploy/scripts/assert-image-arch.sh "$NS/api:$SHA"
            docker push "$NS/api:$SHA"
            docker push "$NS/api:latest"
            docker push "$NS/worker:$SHA"
            docker push "$NS/worker:latest"
          fi

      - name: Build & push frontend
        if: ${{ env.DEPLOYMENT_TYPE == 'build' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        env:
          # "Sign in with Google" client id, baked into the bundle at build. It is public
          # (it ships in the browser regardless) but kept OUT of git — set it once as the
          # GOOGLE_CLIENT_ID GitHub Actions secret. Empty => the button stays hidden.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          SHA=${{ steps.tag.outputs.sha }}
          NS="${{ steps.reg.outputs.push_host }}/$IMAGE_NAMESPACE"
          BRAND="${BRAND:-beacon}"
          # The frontend is the ONLY brand-specific image: NEXT_PUBLIC_BRAND (src/brand)
          # is inlined into the bundle at build time. A non-default brand gets a
          # brand-prefixed tag so a SysOps build never overwrites Beacon's
          # frontend:latest — deploy it with --set image.frontendTag=<brand>-<tag>.
          if [ "$BRAND" = "beacon" ]; then
            FE_SHA="frontend:$SHA"; FE_LATEST="frontend:latest"
          else
            FE_SHA="frontend:${BRAND}-$SHA"; FE_LATEST="frontend:${BRAND}-latest"
          fi
          # Empty NEXT_PUBLIC_API_BASE_URL => the browser calls the API same-origin
          # (/api/...) through the gateway. No CORS. amd64 is native on both runners
          # (ubuntu-latest for non-prod, the LAN Linux/X64 runner for prod).
          if [ "$TARGET_ENV" = "prod" ]; then
            docker buildx build --platform "$BUILD_PLATFORM" $BUILDX_FLAGS --push \
              -f frontend/Dockerfile \
              --build-arg NEXT_PUBLIC_API_BASE_URL="" \
              --build-arg NEXT_PUBLIC_BRAND="$BRAND" \
              --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID:-}" \
              -t "$NS/$FE_SHA" -t "$NS/$FE_LATEST" \
              ./frontend
          else
            docker buildx build --platform "$BUILD_PLATFORM" $BUILDX_FLAGS --load \
              -f frontend/Dockerfile \
              --build-arg NEXT_PUBLIC_API_BASE_URL="" \
              --build-arg NEXT_PUBLIC_BRAND="$BRAND" \
              --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID:-}" \
              -t "$NS/$FE_SHA" -t "$NS/$FE_LATEST" \
              ./frontend
            ./deploy/scripts/assert-image-arch.sh "$NS/$FE_SHA"
            docker push "$NS/$FE_SHA"
            docker push "$NS/$FE_LATEST"
          fi

  deploy:
    runs-on: self-hosted
    # `dns` must land before helm, so the record is resolvable by the time
    # cert-manager tries to solve the HTTP-01 challenge for the new host.
    # `wslproxy` must land too: the edge has to hold the vhost + rule before the
    # HTTP-01 challenge (and real traffic) arrives at it. Full chain on push:
    #   dns -> wslproxy -> deploy   (build runs alongside dns/wslproxy)
    needs: [build, dns, wslproxy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode kubeconfig
        if: ${{ env.DEPLOYMENT_TYPE == 'deploy' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        env:
          # KUBE_CONFIG_DATA_K3S holds the current k3s1 cluster kubeconfig
          # (base64) — updated after k3s0 (k3s0.diytaxreturn.co.uk:6443) was
          # decommissioned. Keep the kubeconfig in this secret current.
          KUBECONFIG_BASE64: ${{ secrets.KUBE_CONFIG_DATA_K3S }}
        run: |
          echo "$KUBECONFIG_BASE64" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> "$GITHUB_ENV"

      - name: Ensure kubectl
        if: ${{ env.DEPLOYMENT_TYPE == 'deploy' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          fi

      - name: Ensure Helm
        if: ${{ env.DEPLOYMENT_TYPE == 'deploy' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

      - name: Deploy Beacon Helm chart
        if: ${{ env.DEPLOYMENT_TYPE == 'deploy' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.IMAGE_TAG }}"
          [ -z "$TAG" ] && TAG="${GITHUB_SHA::7}"

          # Beacon deploys as release `beacon` into the env namespace, exactly as before.
          # A white-label brand deploys as its own release into `<brand>-<env>`, so it
          # never collides with Beacon (the chart's resource names are `beacon-*` and are
          # not release-scoped, so two brands cannot share one namespace).
          if [ "$BRAND" = "beacon" ]; then
            RELEASE="beacon"; NAMESPACE="${TARGET_ENV}"
            VALUES="values-${TARGET_ENV}.yaml"; EXTRA=""
          else
            RELEASE="${BRAND}"; NAMESPACE="${BRAND}-${TARGET_ENV}"
            VALUES="values-${BRAND}-${TARGET_ENV}.yaml"
            # The brand ships a branded frontend image ($BRAND-$TAG); api/worker are
            # brand-neutral and stay on the shared backend tag ($TAG).
            EXTRA="--set image.frontendTag=${BRAND}-${TAG}"
            kubectl get namespace "$NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$NAMESPACE"
            # The image PULL secret is always copied from the base env (the brand values
            # reference nebulacr-login with pullSecretCreate=false).
            COPY_SECRETS="nebulacr-login"
            # beacon-secrets is copied ONLY for brands that reuse the base env's secrets
            # (secretsSource: existing). A brand with its OWN sealed secrets
            # (secretsSource: sealed, e.g. sysops-prod) provides beacon-secrets via its
            # committed SealedSecret, and the base namespace may not even have one — so
            # copying would either fail (base secret missing) or clobber the sealed one.
            if grep -qE '^secretsSource:[[:space:]]*existing' "./deploy/helm/beacon/${VALUES}"; then
              COPY_SECRETS="beacon-secrets ${COPY_SECRETS}"
            else
              echo "Brand '${BRAND}' uses dedicated secrets (not 'existing') — not copying beacon-secrets."
            fi
            for s in $COPY_SECRETS; do
              echo "Copying secret '$s': ${TARGET_ENV} -> ${NAMESPACE}"
              kubectl -n "$TARGET_ENV" get secret "$s" -o json \
                | jq 'del(.metadata.namespace, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.ownerReferences, .metadata.managedFields, .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration", .metadata.labels, .status)' \
                | kubectl -n "$NAMESPACE" apply -f -
            done
          fi
          echo "NAMESPACE=$NAMESPACE" >> "$GITHUB_ENV"

          echo "Deploying release '$RELEASE' (brand=$BRAND) to namespace '$NAMESPACE' with image tag '$TAG'..."
          # image.registry is pinned to the host the build job actually pushed to,
          # so a values-file edit can never send the cluster to a different registry.
          helm upgrade --install "$RELEASE" ./deploy/helm/beacon \
            -f "./deploy/helm/beacon/${VALUES}" \
            --set image.registry="${{ needs.build.outputs.registry }}" \
            --set image.tag="$TAG" \
            $EXTRA \
            --namespace "$NAMESPACE" --create-namespace \
            --wait --timeout 10m

      - name: Rollout status
        if: ${{ env.DEPLOYMENT_TYPE == 'deploy' || env.DEPLOYMENT_TYPE == 'build-and-deploy' }}
        run: |
          kubectl -n "$NAMESPACE" rollout status deploy/beacon-api --timeout=5m || true
          # The namespace is shared with other products, so scope the listing to ours.
          kubectl -n "$NAMESPACE" get pods -o wide -l app.kubernetes.io/part-of=beacon

      - name: Slack notification
        if: ${{ always() && (env.DEPLOYMENT_TYPE == 'deploy' || env.DEPLOYMENT_TYPE == 'build-and-deploy') }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: general
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: "Beacon deployment status"
