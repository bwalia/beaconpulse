name: Android Release (Google Play)

# Builds the Play Store bundle (AAB) for every Android brand on every push to main, and
# uploads it to Play's internal testing track once the Play secrets exist — the Android
# twin of ios-release.yml, and unfiltered on android/** for the same reason: the app is
# the website (android/ is a Trusted Web Activity), so a web change is an app change.
#
# Secrets (repository):
#   ANDROID_UPLOAD_KEYSTORE_B64       base64 of the upload keystore (alias "upload")
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  its password
#   PLAY_SERVICE_ACCOUNT_JSON         Play Console service account with release rights
# Without the keystore the bundle is unsigned; without the service account it is only
# kept as a run artifact. Google needs the very first bundle uploaded by hand in Play
# Console: download it from this workflow's run artifacts.

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: beaconpulse-android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - brand: sysops
            package: com.sysops247.app
    env:
      BRAND: ${{ matrix.brand }}
      KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Upload key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon "bundle${BRAND^}Release" -PversionCode="$GITHUB_RUN_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.brand }}-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/${{ matrix.brand }}Release/*.aab

      - name: Upload to Play (internal testing)
        if: env.PLAY_JSON != '' && env.KEYSTORE_B64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.package }}
          releaseFiles: android/app/build/outputs/bundle/${{ matrix.brand }}Release/*.aab
          track: internal
          status: completed
