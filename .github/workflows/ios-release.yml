name: iOS Release (TestFlight & App Store)

# Build, sign, and upload the white-label iOS apps (SysOps 24/7, Red Fox Signals).
#
# Both brands are targets in ONE XcodeGen project sharing one source set, so a run
# builds them as a serialised matrix — never in parallel: `prepare_signing` rewrites
# the shared Beacon.xcodeproj and the shared signing keychain, so two brands building
# at once would sign each other's target.
#
#   PRIMARY   : every push to main — TestFlight internal. Deliberately NOT
#               filtered on ios/**: the app is a client of this backend, so a
#               backend or config merge can change its behaviour just as much as
#               a Swift change. Testers always run a build of current main.
#   MANUAL    : workflow_dispatch — TestFlight by default; target = app_store
#               submits the build for App Store review (after TestFlight QA)
#
# Ported from the Ring Promoter pipeline
# (ring-promoter/.github/workflows/ios-release.yml). Runs on the self-hosted
# Mac Studio runner (hh193-beacon). Signing secrets are loaded from HashiCorp
# Vault (secret/beaconpulse/ios) at build time — nothing stored in GitHub.
# The signing keychain is shared with KubePilot/Ring Promoter on purpose: all
# apps belong to the same Apple team, and reusing the keychain means fastlane
# `cert` reuses one Apple Distribution certificate instead of minting another
# (Apple caps distribution certs per team).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version override (blank = MARKETING_VERSION in ios/project.yml)"
        required: false
        default: ""
      target:
        description: "Upload destination"
        required: true
        type: choice
        default: testflight
        options:
          - testflight
          - app_store
      brand:
        description: "Which brand to ship"
        required: true
        type: choice
        default: all
        options:
          - all
          - sysops
          - redfox
  push:
    branches:
      - main

concurrency:
  group: beaconpulse-ios-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Which brands this run ships. A push builds every brand; a manual run can pick one.
  # `dir` is the Brands/<dir>/ folder and the scheme name; `key` is what $BRAND uses.
  prepare:
    name: Resolve brand matrix
    runs-on: ubuntu-latest
    outputs:
      brands: ${{ steps.matrix.outputs.brands }}
    steps:
      - id: matrix
        env:
          SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.brand || 'all' }}
        run: |
          set -euo pipefail
          ALL='[{"key":"sysops","dir":"SysOps"},{"key":"redfox","dir":"RedFox"}]'
          if [ "$SELECTED" = "all" ]; then
            BRANDS="$ALL"
          else
            BRANDS="$(printf '%s' "$ALL" | python3 -c 'import json,os,sys; print(json.dumps([b for b in json.load(sys.stdin) if b["key"] == os.environ["SELECTED"]]))')"
          fi
          [ "$BRANDS" != "[]" ] || { echo "::error::no brand matches '$SELECTED'"; exit 1; }
          echo "Building: $BRANDS"
          echo "brands=$BRANDS" >> "$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.brand.dir }} → ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'testflight' }}
    needs: [prepare]
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    strategy:
      # Serialised on purpose — see the header. One brand failing must not cancel the
      # other, so the second still reaches TestFlight.
      max-parallel: 1
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(needs.prepare.outputs.brands) }}
    defaults:
      run:
        working-directory: ios
    env:
      BRAND: ${{ matrix.brand.key }}
      VAULT_TOKEN_FILE: /Users/balinderwalia/.secrets/acc-vault/login-token.json
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure build keychain
        run: |
          set -euo pipefail
          # Shared with KubePilot/Ring Promoter (same Apple team) so `cert`
          # reuses the Apple Distribution certificate already in this keychain.
          pass_file="$HOME/.secrets/kubepilot/keychain-password"
          mkdir -p "$(dirname "$pass_file")"
          if [ ! -s "$pass_file" ]; then
            ( umask 077; openssl rand -base64 24 > "$pass_file" )
          fi
          kc_pass="$(cat "$pass_file")"
          echo "::add-mask::$kc_pass"
          {
            echo "BUILD_KEYCHAIN_PATH=$HOME/Library/Keychains/kubepilot-signing.keychain-db"
            echo "BUILD_KEYCHAIN_PASSWORD=$kc_pass"
            echo "EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions.plist"
          } >> "$GITHUB_ENV"

      - name: Load signing secrets from Vault
        run: |
          chmod +x ./ci/load-ios-vault-secrets.sh
          ./ci/load-ios-vault-secrets.sh

      - name: Install Ruby dependencies
        run: bundle install

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          # TestFlight and the App Store deliver over the *production* APNs
          # environment; the generated entitlements default to development.
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" \
            "Brands/${{ matrix.brand.dir }}/${{ matrix.brand.dir }}.entitlements"

      - name: Resolve marketing version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          else
            v="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9][0-9.]*\).*/\1/p' project.yml | head -1)"
          fi
          [ -n "$v" ] || { echo "Could not resolve a marketing version"; exit 1; }
          echo "Resolved version: $v"
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"

      - name: Compute next build number
        id: build
        run: bundle exec fastlane ios ci_build_number

      - name: Prepare code signing
        run: bundle exec fastlane ios prepare_signing

      - name: Build signed IPA
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: bundle exec fastlane ios build_ipa

      - name: Upload to TestFlight (internal)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'testflight')
        run: bundle exec fastlane ios beta

      - name: Submit for App Store review
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'app_store'
        run: bundle exec fastlane ios release

      - name: Archive IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.brand.key }}-ios-ipa
          path: ios/build/${{ matrix.brand.dir }}.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          # The signing keychain is intentionally persistent (see Configure build
          # keychain) — lock it rather than delete it so the cert survives.
          security lock-keychain "$BUILD_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$EXPORT_OPTIONS_PLIST" 2>/dev/null || true
          rm -f "${ASC_KEY_FILEPATH:-}" 2>/dev/null || true
          rm -f "${INSTALLED_PROFILE_PATH:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/*.cer "$RUNNER_TEMP"/*.p12 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/.ios-secrets" "${IOS_SECRETS_DIR:-}" 2>/dev/null || true
