# XcodeGen project definition. Regenerate the Xcode project with:
#   cd ios && xcodegen generate
#
# White-label by design: every brand is a target built from ONE shared source
# set (Sources/) plus its own Brands/<Brand>/ folder (xcconfig + Info.plist +
# assets). Adding a brand is a new folder and a two-line target entry here — no
# Swift changes. All brand-specific values (API URL, bundle id, Google client
# id, display name, accent colour) live in the brand's xcconfig, never in code.
name: Beacon
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targetTemplates:
  BrandApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Brands/${brand}/Assets.xcassets
    configFiles:
      Debug: Brands/${brand}/brand.xcconfig
      Release: Brands/${brand}/brand.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Brands/${brand}/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Brands/${brand}/${brand}.entitlements
      properties:
        aps-environment: development # Xcode/TestFlight distribution uses "production" — see README
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    scheme:
      testTargets:
        - BeaconTests

  # The Mac app: the same Sources/ and brand folder, a Mac Info.plist shared by all
  # brands (Mac/Info.plist, values from brand.xcconfig), and the same bundle id as
  # iOS, so App Store Connect sells it as one Universal Purchase app and APNs push
  # reaches it through the same `ios` device path.
  BrandMacApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Brands/${brand}/Assets.xcassets
    configFiles:
      Debug: Brands/${brand}/brand.xcconfig
      Release: Brands/${brand}/brand.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Mac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: "YES"
    entitlements:
      path: Brands/${brand}/${brand}-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.aps-environment: development # App Store export switches it to production
        com.apple.developer.applesignin:
          - Default
        keychain-access-groups: # GoogleSignIn keeps its session in this shared group on macOS
          - $(AppIdentifierPrefix)com.google.GIDSignIn
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn

targets:
  SysOps:
    templates: [BrandApp]
    templateAttributes:
      brand: SysOps
  Beacon:
    templates: [BrandApp]
    templateAttributes:
      brand: Beacon
  RedFox:
    templates: [BrandApp]
    templateAttributes:
      brand: RedFox
  SysOps-macOS:
    templates: [BrandMacApp]
    templateAttributes:
      brand: SysOps

  BeaconTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SysOps
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
