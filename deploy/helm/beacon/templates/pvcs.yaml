{{- /*
Persistent volumes. The two control-plane surfaces (prom-generated,
blackbox-config) are written by api/worker and read by prometheus/blackbox. On
single-node k3s the RWO volumes are shared by pods on the same node. The global
nodeSelector (values.yaml) pins every pod to one node, so RWO stays valid on
multi-node clusters too; for true multi-node spread switch storage.className to an
RWX provisioner (NFS/Longhorn) and drop the nodeSelector.

Every PVC is ALWAYS rendered and carries `helm.sh/resource-policy: keep`. Always
rendering keeps each PVC in the release manifest, so Helm never prunes (deletes) a
data volume on upgrade; `keep` is defence-in-depth so it is spared even if a future
chart edit stops rendering it. Do NOT guard these with a `lookup`-and-skip: omitting
an existing PVC from the manifest makes Helm delete it (the `keep` protection only
applies once it is present on the TRACKED resource), which wipes the volume.
Re-applying an unchanged, immutable PVC on every upgrade is a harmless no-op — the
right place to stop a broken cluster PVC admission webhook (e.g. Longhorn's, which
matches ALL PVCs with failurePolicy=Fail) from blocking deploys is the cluster
(recover the node / scope the webhook), not by dropping PVCs from the manifest.
Trade-off: a size change is applied on upgrade, but local-path can't online-resize.
*/}}
{{- $vols := list
  (dict "name" "beacon-postgres-data" "size" .Values.storage.postgres)
  (dict "name" "beacon-redis-data" "size" .Values.storage.redis)
  (dict "name" "beacon-prometheus-data" "size" .Values.storage.prometheus)
  (dict "name" "beacon-alertmanager-data" "size" .Values.storage.alertmanager)
  (dict "name" "beacon-prom-generated" "size" .Values.storage.promGenerated)
  (dict "name" "beacon-blackbox-config" "size" .Values.storage.blackboxConfig)
}}
{{- range $v := $vols }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $v.name }}
  labels:
    {{- include "beacon.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ $.Values.storage.className }}
  resources:
    requests:
      storage: {{ $v.size }}
{{- end }}
