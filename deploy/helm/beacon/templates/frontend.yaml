apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beacon.name" "frontend" }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.selector" "frontend" | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas.frontend }}
  # In-place rollout: every Beacon pod is pinned to a single node (values.yaml
  # nodeSelector), and a busy node can sit at its max-pods limit — so the default
  # surge (add a new pod before removing an old one) can never schedule and the
  # rollout deadlocks. maxSurge:0 + maxUnavailable:1 replaces a replica in its own
  # freed slot instead, which always fits. Brief dip to N-1 replicas is fine for a
  # stateless frontend behind a Service.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "beacon.selector" "frontend" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beacon.labels" . | nindent 8 }}
        {{- include "beacon.selector" "frontend" | nindent 8 }}
    spec:
      {{- include "beacon.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "beacon.image" (dict "root" . "name" "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image is built with NEXT_PUBLIC_API_BASE_URL="" so the browser
          # calls the API same-origin (/api/...) through the gateway.
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            # Server-side only. The public status page is server-rendered, so it
            # needs a real API host to fetch from — the browser's base URL is
            # deliberately empty (same-origin through the gateway) and would make
            # a server-side fetch throw "Invalid URL".
            - name: BEACON_INTERNAL_API_URL
              value: "http://{{ include "beacon.name" "api" }}:8080"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "beacon.name" "frontend" }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "beacon.selector" "frontend" | nindent 4 }}
  ports:
    - port: 3000
      targetPort: 3000
