# ── Red Fox Signals — integration environment ──────────────────────────────────────
# Namespace: redfox-int   Host: https://int.redfoxsignals.com
#
# The THIRD brand, built exactly like SysOps 24/7 (see values-sysops-int.yaml):
#   • image.frontendTag points at a frontend image built with NEXT_PUBLIC_BRAND=redfox
#     (name, mark and the ORANGE theme are baked in at build time — src/brand/redfox.ts).
#   • The api/worker images are brand-neutral, so they are shared with Beacon unchanged.
#
# FULLY AUTOMATED: run the "Beacon … Deploy to K3S" workflow with BRAND=redfox,
# TARGET_ENV=int — DNS + wslproxy + build + deploy, no manual step. See DEPLOY-A-BRAND.md.
env: redfox-int

# The domain. This one value drives the Ingress host, the TLS SAN, CORS, the dashboard
# URL, Alertmanager's external URL and the Stripe return URLs.
host: int.redfoxsignals.com

# PLACEMENT. The chart pins every Beacon pod to one node (values.yaml nodeSelector,
# default debworker00) so the RWO local-path PVCs stay co-located — local-path volumes
# carry node affinity, so a pod that moves cannot mount its own data.
#
# debworker00 already hosts beacon-int AND sysops-int; adding a third full stack put it
# over the kubelet pod-count limit, and the scheduler rejected it with
# "0/16 nodes are available: 1 Too many pods, ...". Note it was NOT short of CPU or
# memory (37% / 16%) — purely pod count. Pin this brand to its own worker instead.
#
# Changing this later is not free: the existing PVs stay on the old node, so the
# namespace has to be deleted and redeployed for the volumes to be recreated here.
nodeSelector:
  kubernetes.io/hostname: debian006

app:
  beaconEnv: staging
  logLevel: debug
  promRetention: 7d
  replicas:
    api: 1
    frontend: 1

ai:
  enabled: true
  baseURL: https://ollama.workstation.co.uk
  model: qwen3:30b-a3b
  timeout: 60s

storage:
  postgres: 5Gi
  redis: 1Gi
  prometheus: 5Gi
  alertmanager: 1Gi

ingress:
  enabled: true
  # TLS terminates at the wslproxy edge (pop0), not in-cluster — this cluster has no
  # cert-manager, so tls:true attaches a Secret that never exists and traefik silently
  # stops serving the vhost. Same as every other environment here.
  tls: false

# Reuse the base int environment's secrets with zero manual sealing: the deploy pipeline
# copies `beacon-secrets` (and the `nebulacr-login` pull secret) from the `int` namespace
# into `redfox-int` before helm runs. Fine for a shared INT tier; prod gets its own
# (see values-redfox-prod.yaml).
secretsSource: existing

image:
  registry: int-spectoncr.diytaxreturn.co.uk
  # The branded frontend image, built by CI with BRAND=redfox (tag: redfox-<sha>).
  frontendTag: redfox-latest
  pullSecret: nebulacr-login
  pullSecretCreate: false
