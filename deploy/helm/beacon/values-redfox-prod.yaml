# ── Red Fox Signals — production environment ───────────────────────────────────────
# Namespace: redfox-prod   Host: https://redfoxsignals.com   (apex, via CNAME flattening)
# Deploy: run the workflow with BRAND=redfox, TARGET_ENV=prod. See DEPLOY-A-BRAND.md.
env: redfox-prod
host: redfoxsignals.com
# www serves the same app as the apex (no redirect): Ingress host rule + TLS SAN via the
# chart, CNAME via the dns job, edge vhost via the wslproxy job.
extraHosts:
  - www.redfoxsignals.com

# PLACEMENT — READ BEFORE THE FIRST PROD DEPLOY. The chart's default nodeSelector
# (values.yaml) pins every pod to debworker00, which is already at its pod-count limit
# from beacon-int + sysops-int + redfox-int. This file does not override it, so the
# first prod deploy will fail to schedule exactly as redfox-int did. Choose a node with
# pod headroom and set nodeSelector here first (redfox-int uses k3s-worker-08).
#
# Deliberately NOT pinned to cloud003, unlike values-sysops-prod.yaml.
# SysOps pins every pod to that single public edge node for a ~14ms edge->origin hop,
# but a second full production stack there (postgres + redis + prometheus +
# alertmanager + 2x api + 2x frontend) risks exhausting it. Red Fox Signals instead takes the
# same path beaconpulse.net's prod uses: the wslproxy rule backends to the k3s1 traefik
# ingress, which schedules across the cluster. If Red Fox Signals later needs the low-latency
# edge placement, copy the nodeSelector + edge toleration out of values-sysops-prod.yaml
# and repoint redfox-prod-default at 77.68.126.63:80.

app:
  beaconEnv: production
  logLevel: info
  promRetention: 30d
  # Platform operator(s): global /platform surface + auto-Pro. Must match the address
  # you actually sign into redfoxsignals.com with (Google sign-in uses your Google email).
  platformAdminEmails:
    - tenthmatrix.mailer@gmail.com
  replicas:
    api: 2
    frontend: 2

ai:
  enabled: true
  baseURL: https://ollama.workstation.co.uk
  model: qwen3:30b-a3b
  timeout: 60s

storage:
  postgres: 20Gi
  redis: 2Gi
  prometheus: 30Gi
  alertmanager: 2Gi

resources:
  api:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }
  prometheus:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

ingress:
  enabled: true
  # TLS terminates at the wslproxy edge (pop0); no cert-manager in this cluster.
  tls: false

# PRODUCTION SECRETS — DEDICATED & ISOLATED.
# A production brand must NOT reuse int's secrets: a JWT secret shared with a tier
# anyone can sign up on would make a token minted there valid here, and the encryption
# key is what protects customers' notification credentials at rest.
#
# Secrets come from wslvault via External Secrets Operator. ESO reads
# kv/beaconpulse/redfox-prod/config from the wslvault-backend ClusterSecretStore.
# POPULATE THE VAULT BEFORE THE FIRST PROD DEPLOY, or the pods come up with no
# POSTGRES_PASSWORD behind a green helm release:
#   deploy/scripts/vault-load-secrets.sh redfox-prod
secretsSource: external

image:
  # Prod routes through int-spectoncr (stable, LAN-hosted); the prod registry's cloud
  # nodes drop ~1/3 of connections. The deploy job copies int's pull creds into this
  # namespace as `beacon-registry-pull`.
  registry: int-spectoncr.diytaxreturn.co.uk
  frontendTag: redfox-latest
  pullSecret: beacon-registry-pull
  pullSecretCreate: false
