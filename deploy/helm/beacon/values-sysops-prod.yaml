# ── SysOps 24/7 — production environment (white-label) ──────────────────────
# Namespace: sysops-prod   Host: https://sysops247.com   (apex, via CNAME flattening)
# Deploy: run the workflow with BRAND=sysops, TARGET_ENV=prod (fully automated).
# See DEPLOY-A-BRAND.md. Mirrors values-prod.yaml, re-skinned for the SysOps brand.
env: sysops-prod
host: sysops247.com
# www serves the same app as the apex (no redirect): Ingress host rule + TLS SAN
# via the chart, CNAME via the dns job, edge vhost via the wslproxy job.
extraHosts:
  - www.sysops247.com

# LOW-LATENCY PROD PLACEMENT — everything on cloud003, served by cloud003.
# cloud003 is a public edge node (77.68.126.63) running traefik-edge on hostPort 80,
# and the wslproxy sysops-prod-default rule backends straight to it: measured 14ms
# edge->cloud003 vs ~3s edge->LAN NAT. Pinning ALL pods here (the chart applies this
# to every component) keeps app<->db<->cache traffic node-local AND sidesteps the
# broken cloud003<->LAN pod-network path — nothing prod needs lives off this node
# (cluster DNS is node-local via the coredns-node DaemonSet; verified 10/10 sub-ms).
nodeSelector:
  kubernetes.io/hostname: cloud003
# cloud003 is tainted node-role.kubernetes.io/edge=true:NoSchedule — without this
# toleration every pod (and its WaitForFirstConsumer PVC) sits Pending forever.
tolerations:
  - key: node-role.kubernetes.io/edge
    operator: Equal
    value: "true"
    effect: NoSchedule

app:
  beaconEnv: production
  logLevel: info
  promRetention: 30d
  # Platform operator(s): global /platform surface + auto-Pro. Must match the address
  # you actually sign into sysops247.com with (Google sign-in uses your Google email).
  platformAdminEmails:
    - tenthmatrix.mailer@gmail.com
  replicas:
    api: 2
    frontend: 2

ai:
  enabled: true
  baseURL: https://ollama.workstation.co.uk
  model: qwen3:30b-a3b
  timeout: 60s

storage:
  postgres: 5Gi
  redis: 1Gi
  prometheus: 10Gi
  alertmanager: 1Gi

ingress:
  enabled: true
  # TLS is terminated at the wslproxy edge (pop0), NOT in-cluster. This cluster has
  # no cert-manager, so tls:true would make traefik attach a Secret that never exists
  # and silently stop serving the vhost. The int/acc/test brands use false for the
  # same reason; the edge holds a valid sysops247.com cert (ssl_auto_renew).
  tls: false

# PRODUCTION SECRETS — DEDICATED & ISOLATED.
# sysops-prod has its OWN sealed secrets under deploy/helm/beacon/sealed/sysops-prod/,
# so its JWT + ENCRYPTION keys are cryptographically independent of Beacon. The
# sealed-secrets controller decrypts them in-namespace; the committed ciphertext is
# safe. Regenerate with:  deploy/scripts/seal-secrets.sh sysops-prod
# The deploy pipeline still copies the nebulacr-login PULL secret from `prod`, but it
# Production secrets come from wslvault via External Secrets Operator (NOT kubeseal).
# ESO reads kv/beaconpulse/sysops-prod/config from the wslvault-backend
# ClusterSecretStore. Populate the vault with:
#   deploy/scripts/vault-load-secrets.sh sysops-prod
# The deploy pipeline still copies only the nebulacr-login PULL secret for the brand.
secretsSource: external

image:
  # Prod routes through int-spectoncr (stable, LAN-hosted); the prod registry's cloud
  # nodes drop ~1/3 of connections. The deploy job copies int's pull creds into this
  # namespace as `beacon-registry-pull`. Revert to spectoncr when the cloud nodes heal.
  registry: int-spectoncr.diytaxreturn.co.uk
  frontendTag: sysops-latest
  pullSecret: beacon-registry-pull
  pullSecretCreate: false
