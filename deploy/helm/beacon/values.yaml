# Default values for the Beacon chart. Environment-specific overrides live in
# values-int.yaml / values-acc.yaml / values-test.yaml / values-prod.yaml and are
# passed with `-f` at deploy time. Everything here is a sane default; each env
# file only sets what differs (host, image tag, env label, sizes, AI settings).

# env is the deployment tier label (int|acc|test|prod). It selects the Vault path
# (secret/beaconpulse/<env>/config) and is surfaced for labels. ALWAYS overridden
# by the env values file.
env: int

# Public gateway hostname for this environment (the single nginx entry point).
# ALWAYS overridden by the env values file, e.g. int.beaconpulse.net.
host: int.beaconpulse.net

# Additional hostnames served by the same Ingress (e.g. www alongside an apex).
# Each entry also gets its CNAME upserted by the deploy workflow's dns job.
extraHosts: []

# ── Beacon application images (built + pushed by CI to the SpectonCR registry) ─
# Full refs are composed as <registry>/<namespace>/<name>:<tag>, so the registry
# host is stated exactly once and cannot drift between the three images.
# api and worker are the same image (both binaries); they differ only by command.
image:
  # SpectonCR resolves per environment, matching the platform's other charts:
  # prod lives at the bare host, every other env gets the env prefix.
  #   int  -> int-spectoncr.diytaxreturn.co.uk
  #   prod -> spectoncr.diytaxreturn.co.uk
  # CI passes --set image.registry=<resolved> and asserts it matches this file.
  registry: int-spectoncr.diytaxreturn.co.uk
  namespace: beacon
  # Overridden per-deploy by CI with the git SHA for immutable, traceable rollouts.
  tag: latest
  # White-label override for the ONE brand-specific image. The frontend bakes its
  # name/logo/colour in at build time (NEXT_PUBLIC_BRAND), so a second brand needs its
  # own frontend image — but the api/worker binaries are brand-neutral and shared.
  # Empty = use `tag` above (the Beacon default). Set it (e.g. "sysops-latest") to run
  # a branded dashboard on the shared backend. See values-sysops-int.yaml.
  frontendTag: ""
  pullPolicy: IfNotPresent
  # dockerconfigjson pull secret the pods reference. Empty = public registry.
  pullSecret: beacon-registry
  # true  — this chart creates the pull secret (from Vault, or from a sealed file).
  # false — the secret already exists in the namespace and is managed elsewhere;
  #         the chart only references it. Used in int, where the shared
  #         `nebulacr-login` secret already carries auth for the SpectonCR host.
  pullSecretCreate: true

# ── Third-party images (pinned to match docker-compose) ────────────────────
images:
  postgres: postgres:16-alpine
  redis: redis:7-alpine
  prometheus: prom/prometheus:v2.54.1
  blackbox: prom/blackbox-exporter:v0.25.0
  alertmanager: prom/alertmanager:v0.27.0
  promLabelProxy: quay.io/prometheuscommunity/prom-label-proxy:v0.11.0
  nginx: nginx:1.27-alpine
  # busybox is used by the blackbox init container to seed its config.
  busybox: busybox:1.36

# ── Beacon runtime configuration (non-secret) ──────────────────────────────
app:
  # BEACON_ENV — one of development|staging|production. Drives Secure-cookie and
  # secret-strength enforcement, NOT the deployment tier. Prod uses "production";
  # lower envs use "staging". Overridden per env file.
  beaconEnv: staging
  logLevel: info
  logFormat: json
  # BEACON_BRAND_NAME — product name shown in alert notifications (email subject
  # prefix, the "Open in <brand>" button). Per-brand: a white-label overrides this
  # in its values-<brand>-<env>.yaml so its alerts read as its own product.
  brandName: Beacon Pulse
  # DNS resolver used by DNS monitors.
  dnsResolver: 8.8.8.8:53
  # NOTE: "Sign in with Google" — BEACON_GOOGLE_CLIENT_ID is NOT a raw chart value.
  # It travels through the sealed beacon-secrets (deploy/scripts/seal-secrets.sh reads
  # it from deploy/.env), same as the JWT/Stripe secrets, and the API reads it via a
  # secretKeyRef. Nothing to set here.
  # Prometheus TSDB retention.
  promRetention: 15d
  # BEACON_PLATFORM_ADMIN_EMAILS — operators who get the global /platform surface
  # (edit pricing/limits/premium grants) AND auto-Pro for their own org. GLOBAL, not
  # per-tenant, so it is a deploy-time value set per environment, NOT self-service.
  # These are emails, not credentials, so they live here (git/values) rather than in
  # Vault. A bare domain grants every user at that domain; "user@host" is one address.
  # Empty = no operator (the /platform page stays locked for everyone). Set per env.
  platformAdminEmails: []
  replicas:
    api: 1
    frontend: 1

# ── AI alert enrichment (non-secret parts; API key comes from Vault) ───────
ai:
  enabled: false
  baseURL: ""      # e.g. https://ollama.workstation.co.uk
  model: ""        # e.g. qwen3:30b-a3b
  timeout: 20s

# ── OpsAPI / OIDC single sign-on (non-secret parts; client secret from Vault) ──
# "Continue with <provider>" via the OAuth2 code flow. OFF by default; the backend
# endpoint self-hides until clientId/secret + the three URLs are all present.
# To ENABLE in an environment you need THREE things, not just enabled:true —
#   1. set enabled:true + provider + clientId + the three URLs here,
#   2. put BEACON_OIDC_CLIENT_SECRET in that env's beacon-secrets (Vault),
#   3. rebuild the frontend with NEXT_PUBLIC_OIDC_ENABLED=true (a BUILD-time flag,
#      set in the deploy workflow) — otherwise the button never renders.
# redirectURL/postLoginURL default to https://<host>/api/v1/auth/oidc/callback and
# https://<host>/login/callback; override only if the provider needs a different one.
oidc:
  enabled: false
  provider: OpsAPI
  clientId: ""
  authorizeURL: ""
  tokenURL: ""
  userinfoURL: ""
  scopes: "openid,profile,email"
  redirectURL: ""
  postLoginURL: ""

# ── Postgres (in-cluster) ──────────────────────────────────────────────────
postgres:
  user: beacon
  database: beacon
  # Password is provided by the ExternalSecret (Vault key POSTGRES_PASSWORD) and
  # injected into both Postgres and the API/worker DSN.

# ── Persistence ────────────────────────────────────────────────────────────
storage:
  # k3s default provisioner. RWO volumes are shared across control-plane pods on
  # a single node (see README: single-node assumption / RWX for multi-node).
  className: local-path
  postgres: 5Gi
  redis: 1Gi
  prometheus: 10Gi
  alertmanager: 1Gi
  # Shared control-plane config surfaces the API/worker generate for Prometheus
  # and Blackbox to consume.
  promGenerated: 128Mi
  blackboxConfig: 64Mi

# ── How the beacon-secrets Secret gets provisioned ─────────────────────────
# One of:
#   external — External Secrets Operator pulls from Vault. Needs a Vault policy
#              granting read on secret/data/beaconpulse/* (NOT yet granted).
#   sealed   — a committed, encrypted SealedSecret under sealed/<env>/ is
#              decrypted in-cluster by the sealed-secrets controller. Only that
#              controller's private key can decrypt it, so the file is safe to
#              commit. Generate with deploy/scripts/seal-secrets.sh <env>.
#   plain    — a plain Secret from .Values.secrets.* below. Local testing ONLY;
#              never commit real values.
# Egress restriction on the probe pod. Blackbox connects to addresses TENANTS choose,
# from inside the cluster, so without this a monitor pointed at 10.0.0.5:6443 reports
# whether the Kubernetes API is listening — and a name that resolves publicly at create
# time and privately afterwards defeats the application-level check entirely.
#
# This DOES take effect on k3s: although Flannel alone does not implement
# NetworkPolicy, k3s ships an embedded kube-router netpol controller and enforces
# policies unless the server was started with --disable-network-policy.
#
# Off by default all the same, and only because of the blast radius if it is subtly
# wrong. An egress policy that accidentally blocks DNS does not fail loudly — it makes
# every probe fail, which this product reports as every customer's site being down. So
# it is opt-in per environment: turn it on in int, confirm monitors still report up,
# then promote. Verify the controller is running first:
#
#   kubectl -n int get pods -l app=beacon-blackbox      # note the current status
#   helm upgrade ... --set networkPolicy.enabled=true
#   kubectl -n int logs deploy/beacon-blackbox --tail=20 | grep -i "no such host"
#
# Any surge of resolution failures means DNS is being blocked and the policy should
# come straight back off.
networkPolicy:
  enabled: false
  # CIDRs to re-allow, for internal services the operator owns and wants monitored.
  # Single-tenant installs only: on a shared one this hands every tenant a route there.
  allowedInternalCIDRs: []

secretsSource: external

externalSecret:
  refreshInterval: "1m"
  # wslvault's HashiCorp-KV-v2-compatible mount, via the existing ClusterSecretStore
  # (spec.provider.vault.path=kv). The store's `path: kv` already names the mount, so
  # the key here is mount-relative: <prefix>/<env>/<suffix> -> GET /v1/kv/data/beaconpulse/<env>/config.
  storeName: wslvault-backend
  storeKind: ClusterSecretStore
  vaultKeyPrefix: beaconpulse
  vaultKeySuffix: config

# Only used when secretsSource=plain (local testing without Vault/sealed).
# Inject real values with `--set secrets.jwtAccess=...`; never commit them.
secrets:
  jwtAccess: ""
  jwtRefresh: ""
  encryptionKey: ""
  webhookToken: ""
  postgresPassword: ""
  aiApiKey: ""
  # SpectonCR registry pull credentials (fallback path only).
  registryUsername: ""
  registryPassword: ""

# ── Ingress (single gateway host) ──────────────────────────────────────────
# Uses the traefik-edge IngressClass — that's the controller pinned to cloud003
# with hostNetwork on 77.68.126.63:80, which is the backend all beaconpulse and
# sysops247 wslproxy vhosts on pop1 forward to. The default `wslproxy`
# IngressClass is served by the standard k3s traefik on 192.168.1.x, which is
# LAN-only and unreachable from the public pop1 edge — routing worked from the
# operator VPN but 404'd for real users.
#
# tls: false is deliberate. TLS is terminated at pop1 by wslproxy itself
# (ssl_enabled=true + ssl_auto_renew=true in the server records) using its own
# ACME/HTTP-01 flow — a valid cert for int.beaconpulse.net is already presented
# by pop1 at TLS handshake time. Cert-manager is NOT installed on this cluster
# (no CRDs, no ClusterIssuer), so declaring `tls:` on the Ingress just tells
# traefik-edge to attach a Secret that will never be created, and traefik
# quietly stops serving the vhost cleanly for that host. The working
# prod/diytaxreturn-gatus Ingress on this same cluster uses this exact pattern:
# no tls: block, wslproxy owns the cert. cluster serves plain HTTP.
ingress:
  enabled: true
  className: traefik-edge
  tls: false
  # host comes from top-level .Values.host

# ── Per-component resource requests/limits (modest defaults) ───────────────
resources:
  api:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  worker:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  frontend:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  prometheus:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  alertmanager:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
  blackbox:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }
  promLabelProxy:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  nginx:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }
  postgres:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  redis:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 256Mi }

# nodeSelector applied to EVERY Beacon pod. All components are pinned to a single
# node so the RWO PVCs (postgres, redis, prometheus, alertmanager, generated
# config) are always co-located and the workload has a stable home. Pinned via the
# built-in kubernetes.io/hostname label, so no custom node labelling is required.
# Override per-env in values-<env>.yaml if a different node is wanted.
nodeSelector:
  kubernetes.io/hostname: debworker00

# Tolerations applied to EVERY Beacon pod, alongside the nodeSelector. Needed when
# the pinned node carries a taint (the cloud edge nodes are tainted
# node-role.kubernetes.io/edge=true:NoSchedule). Empty for the LAN worker nodes.
tolerations: []

# ── Cluster control-plane monitoring (etcd / kube-apiserver) ─────────────────
# OFF by default, and intended for exactly ONE release per cluster: control-plane
# health is not per-tenant, so enabling it on every release would scrape the same
# apiserver N times and duplicate every alert.
#
# The alert rules live in the infra repo, which owns the cluster:
#   diy-tax-return-infra: clusters/k3s/monitoring/etcd-control-plane-rules.yaml
# That repo applies them as the ConfigMap named below; this chart only mounts it
# (optional: true, so the release installs cleanly before the ConfigMap exists).
controlPlaneMonitoring:
  enabled: false
  rulesConfigMap: etcd-control-plane-rules
